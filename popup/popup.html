<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales HUD</title>
    <style>
      body {
        background: #f8fafc;
        color: #172033;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        width: 300px;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 16px;
      }

      h1 {
        font-size: 17px;
        margin: 0;
      }

      p {
        color: #475569;
        font-size: 13px;
        line-height: 1.45;
        margin: 0;
      }

      button {
        background: #2563eb;
        border: 0;
        border-radius: 10px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 10px 12px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      .secondary {
        background: #ffffff;
        border: 1px solid #cbd5e1;
        color: #172033;
      }

      .status {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        color: #334155;
        font-size: 12px;
        min-height: 34px;
        padding: 9px 10px;
      }

      .status.error {
        background: #fef2f2;
        border-color: #fecaca;
        color: #991b1b;
      }

      .status.ok {
        background: #ecfdf5;
        border-color: #bbf7d0;
        color: #166534;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sales HUD</h1>
      <p>Open a LinkedIn profile, then click the button below to show the HUD.</p>
      <button type="button" id="showHud">Show HUD on this tab</button>
      <button type="button" id="reloadTab" class="secondary">Refresh LinkedIn tab</button>
      <div class="status" id="status">Ready.</div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
